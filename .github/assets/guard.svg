<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">Input guard</title>
  <desc id="d">Four steps: you keep working, your input is held for a moment, the client clicks the game, and your cursor, focus and keystrokes come back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fdff"/><stop offset="1" stop-color="#e6f5fe"/></linearGradient>
    <linearGradient id="primary" x1="0" x2="1"><stop offset="0" stop-color="#52c6fb"/><stop offset="1" stop-color="#1b9be8"/></linearGradient>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="2" height="24" fill="#2fb0f4" opacity=".07"/></pattern>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a6eaa" flood-opacity=".16"/></filter>
    <style>
      text { font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #2b4767; }
      .head { font-size: 30px; font-weight: 800; font-style: italic; fill: #1f3a5a; }
      .sub { font-size: 17px; fill: #4f6b88; }
      .step { font-size: 20px; font-weight: 800; fill: #1f3a5a; }
      .body { font-size: 15px; fill: #4f6b88; }
      .n { font-size: 15px; font-weight: 800; fill: #fff; }
      .i { fill: none; stroke: #1583cc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1280" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="330" rx="22" fill="url(#stripes)"/>
  <text class="head" x="48" y="58">Keep using your PC while it plays</text>
  <text class="sub" x="48" y="88">Every automated click is guarded, so your typing and the game's input never collide.</text>

  <g filter="url(#soft)">
    <path d="M56 116H326L348 196L326 276H56a16 16 0 0 1-16-16V132a16 16 0 0 1 16-16Z" fill="#fff"/>
    <path d="M346 116H626L648 196L626 276H346L368 196Z" fill="#fff"/>
    <path d="M646 116H926L948 196L926 276H646L668 196Z" fill="url(#primary)"/>
    <path d="M946 116H1224a16 16 0 0 1 16 16V260a16 16 0 0 1-16 16H946L968 196Z" fill="#fff"/>
  </g>

  <circle cx="78" cy="150" r="16" fill="#2fb0f4"/><text class="n" x="78" y="156" text-anchor="middle">1</text>
  <text class="step" x="106" y="157">You work</text>
  <text class="body" x="62" y="200">Type, browse and use</text>
  <text class="body" x="62" y="222">your other monitor</text>
  <text class="body" x="62" y="244">as normal.</text>

  <circle cx="400" cy="150" r="16" fill="#2fb0f4"/><text class="n" x="400" y="156" text-anchor="middle">2</text>
  <text class="step" x="428" y="157">Input held</text>
  <text class="body" x="386" y="200">For a fraction of a</text>
  <text class="body" x="386" y="222">second, your keys wait</text>
  <text class="body" x="386" y="244">safely in order.</text>

  <circle cx="700" cy="150" r="16" fill="#fff"/><text class="n" x="700" y="156" text-anchor="middle" style="fill:#1583cc">3</text>
  <text class="step" x="728" y="157" style="fill:#fff">Client clicks</text>
  <text class="body" x="686" y="200" style="fill:#eefaff">One checked click lands</text>
  <text class="body" x="686" y="222" style="fill:#eefaff">on the game, with nothing</text>
  <text class="body" x="686" y="244" style="fill:#eefaff">of yours mixed in.</text>

  <circle cx="1020" cy="150" r="16" fill="#2fc08b"/><path d="m1013 150 5 5 9-10" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="step" x="1048" y="157">You're back</text>
  <text class="body" x="1006" y="200">Your cursor, focus and</text>
  <text class="body" x="1006" y="222">keystrokes return right</text>
  <text class="body" x="1006" y="244">where they belong.</text>
</svg>
