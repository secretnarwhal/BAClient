<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">BAClient features</title>
  <desc id="d">Six feature cards: story clearing, battles, dailies, lessons, students, and the control panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fdff"/><stop offset="1" stop-color="#e6f5fe"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd5ff"/><stop offset="1" stop-color="#1f9be6"/></linearGradient>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="2" height="24" fill="#2fb0f4" opacity=".07"/></pattern>
    <filter id="soft" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2a6eaa" flood-opacity=".15"/></filter>
    <style>
      text { font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #2b4767; }
      .h { font-size: 24px; font-weight: 800; font-style: italic; fill: #1f3a5a; }
      .b { font-size: 16px; fill: #4f6b88; }
      .i { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #fff; }
    </style>
    <g id="tilebg"><rect width="56" height="56" rx="17" fill="url(#tile)"/></g>
  </defs>
  <rect width="1280" height="560" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="22" fill="url(#stripes)"/>

  <g filter="url(#soft)">
    <rect class="card" x="32" y="32" width="388" height="236" rx="18"/>
    <rect class="card" x="446" y="32" width="388" height="236" rx="18"/>
    <rect class="card" x="860" y="32" width="388" height="236" rx="18"/>
    <rect class="card" x="32" y="292" width="388" height="236" rx="18"/>
    <rect class="card" x="446" y="292" width="388" height="236" rx="18"/>
    <rect class="card" x="860" y="292" width="388" height="236" rx="18"/>
  </g>

  <g transform="translate(56 56)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><path d="M12 6.500C10 5 7.500 4.500 4 4.800v13.700c3.500-.3 6 .2 8 1.700 2-1.500 4.500-2 8-1.700V4.800c-3.500-.3-6 .2-8 1.700z"/><path d="M12 6.500v13.700"/></g></g>
  <text class="h" x="56" y="154">Story clearing</text>
  <text class="b" x="56" y="186">Skips main, mini and group stories,</text>
  <text class="b" x="56" y="210">takes the rewards, and pages through</text>
  <text class="b" x="56" y="234">every chapter tagged New.</text>

  <g transform="translate(470 56)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><path d="M14.500 4H20v5.500L9.500 20 4 14.500z"/><path d="m7 12 5 5"/><path d="m4 20 2-2"/></g></g>
  <text class="h" x="470" y="154">Battles</text>
  <text class="b" x="470" y="186">Proceeds through fights and results,</text>
  <text class="b" x="470" y="210">with a smart battler in testing that</text>
  <text class="b" x="470" y="234">times EX skills around enemy waves.</text>

  <g transform="translate(884 56)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><rect x="4.500" y="3.500" width="15" height="17" rx="2.500"/><path d="M8.500 8.500h7M8.500 12.500h7M8.500 16.500h4"/></g></g>
  <text class="h" x="884" y="154">Dailies</text>
  <text class="b" x="884" y="186">Scans what's left today, then handles</text>
  <text class="b" x="884" y="210">mail, tasks, cafe and sweeps, with a</text>
  <text class="b" x="884" y="234">preview before anything is claimed.</text>

  <g transform="translate(56 316)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><path d="m3.500 6.500 5.500-2.500 6 2.500 5.500-2.500v13.500L15 20l-6-2.500-5.500 2.500z"/><path d="M9 4v13.500M15 6.500V20"/></g></g>
  <text class="h" x="56" y="414">Lesson Atlas</text>
  <text class="b" x="56" y="446">See every classroom in one view,</text>
  <text class="b" x="56" y="470">mark who you want to teach, and let</text>
  <text class="b" x="56" y="494">the client run those lessons.</text>

  <g transform="translate(470 316)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><circle cx="9" cy="8.500" r="3.500"/><path d="M3 20c.6-4 3-6 6-6s5.400 2 6 6"/><path d="M15.500 5.300a3.500 3.500 0 0 1 0 6.400"/><path d="M17.500 14.600c1.900.8 3.100 2.700 3.500 5.400"/></g></g>
  <text class="h" x="470" y="414">Students</text>
  <text class="b" x="470" y="446">Reads your roster into a fast, local</text>
  <text class="b" x="470" y="470">browser with levels, skills and gear,</text>
  <text class="b" x="470" y="494">plus team suggestions by armor.</text>

  <g transform="translate(884 316)"><use href="#tilebg"/><g class="i" transform="translate(13 13) scale(1.25)"><rect x="3.500" y="4.500" width="17" height="15" rx="2.500"/><path d="M3.500 9h17"/></g></g>
  <text class="h" x="884" y="414">Control panel</text>
  <text class="b" x="884" y="446">A local app window and live overlay,</text>
  <text class="b" x="884" y="470">with a full action journal and an</text>
  <text class="b" x="884" y="494">instant stop on F8.</text>
</svg>
